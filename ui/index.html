<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Roleplay — Menu de Pause</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body id="page">
  <div class="container">

    <!-- TOP BAR: Player Info -->
    <div class="player-info">
      <img src="images/guest.png" alt="Avatar" id="player-avatar" class="player-avatar">
      <div class="player-info-chips">
        <div class="info-chip">
          <span class="chip-label"><i class="fa-solid fa-user"></i> NOM &bull; PRÉNOM</span>
          <span class="chip-value" id="player-name">Giuseppe Del Papa</span>
        </div>
        <div class="info-chip">
          <span class="chip-label"><i class="fa-solid fa-id-card"></i> ID</span>
          <span class="chip-value" id="player-id-display">ID: KF12345</span>
        </div>
        <div class="info-chip">
          <span class="chip-label"><i class="fa-solid fa-briefcase"></i> JOB 1</span>
          <span class="chip-value" id="job1name">Polizia - Agente</span>
        </div>
        <div class="info-chip" id="job2">
          <span class="chip-label"><i class="fa-solid fa-mask"></i> JOB 2</span>
          <span class="chip-value" id="job2name">Criminale - Boss</span>
        </div>
      </div>
      <img src="images/logo.png?v=4" alt="Logo" class="server-logo">
    </div>

    <!-- MAIN ZONE: Orbital circular layout -->
    <div class="main-functions">

      <!-- Left column: Home (top) + Exit (bottom) -->
      <div class="side-col side-left">
        <div class="orbit-btn btn-home" id="menu-principal-btn">
          <div class="orbit-ring ring-1"></div>
          <div class="orbit-ring ring-2"></div>
          <div class="orbit-inner">
            <i class="fa-solid fa-house btn-icon"></i>
          </div>
          <span class="orbit-label">MENU</span>
        </div>
        <div class="orbit-btn btn-exit" id="exit-btn">
          <div class="orbit-ring ring-1"></div>
          <div class="orbit-ring ring-2"></div>
          <div class="orbit-inner">
            <i class="fa-solid fa-arrow-right-from-bracket btn-icon"></i>
          </div>
          <span class="orbit-label">QUITTER</span>
        </div>
      </div>

      <!-- Center: Large circular map -->
      <div class="map-circle" id="map-btn">
        <!-- Decorative orbit rings -->
        <div class="map-ring map-ring-1"></div>
        <div class="map-ring map-ring-2"></div>
        <div class="map-ring map-ring-3"></div>
        <!-- Scanline overlay -->
        <div class="map-scanline"></div>
        <!-- Map content -->
        <div class="map-inner">
          <span class="map-bg-img" aria-hidden="true">
            <img src="images/map.png" alt="" class="map-img">
          </span>
          <div class="map-overlay"></div>
          <div class="map-content">
            <i class="fa-solid fa-map-location-dot map-icon"></i>
            <span class="map-label">CARTE</span>
          </div>
        </div>
      </div>

      <!-- Right column: Justice (top) + Settings (bottom) -->
      <div class="side-col side-right">
        <div class="orbit-btn btn-justice" id="discord-btn">
          <div class="orbit-ring ring-1"></div>
          <div class="orbit-ring ring-2"></div>
          <div class="orbit-inner">
            <i class="fa-solid fa-scale-balanced btn-icon"></i>
          </div>
          <span class="orbit-label">JUSTICE</span>
        </div>
        <div class="orbit-btn btn-settings" id="settings-btn">
          <div class="orbit-ring ring-1"></div>
          <div class="orbit-ring ring-2"></div>
          <div class="orbit-inner">
            <i class="fa-solid fa-gear btn-icon"></i>
          </div>
          <span class="orbit-label">RÉGLAGES</span>
        </div>
      </div>

    </div>

    <!-- FOOTER BAR -->
    <div class="footer-info">
      <div class="footer-pill pill-time">
        <span class="pill-icon"><i class="fa-solid fa-clock"></i></span>
        <span class="pill-text">
          <span class="pill-label">HEURE FLASHCITY</span>
        </span>
        <span class="pill-value" id="paris-time">--:--</span>
      </div>
      <div class="footer-pill pill-discord" id="discord-footer-btn">
        <span class="pill-icon discord-icon-footer"><i class="fa-brands fa-discord"></i></span>
        <span class="pill-label-large">DISCORD</span>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
